format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$python\
$character
"""

[username]
show_always = true
format = '[$user@]($style)'
style_user = 'fg:172'

[hostname]
format = '[$hostname]($style)'

[directory]
style = "blue"
truncation_length = 3
truncation_symbol = ":…/"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
symbol = " "
format = "[$symbol$branch ]($style) "
style = "bright-black"

[git_status]
format = "([$all_status$ahead_behind$stashed]($style)"
style = "cyan"
conflicted = "⚠️"
untracked = "?"
modified = "!"
staged = "✔"
renamed = "⇆"
deleted = "✘"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total) ]($style)\) '
style = "bright-black"



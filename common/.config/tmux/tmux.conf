# Enable 256-color, true-color and undercurl support for modern terminals and Neovim
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colors

# General
set -g mouse on               # Enable mouse support
set -g set-clipboard on       # Enable system clipboard (OSC 52)
set -g detach-on-destroy off  # Don't exit from tmux when closing a session
set -sg escape-time 0         # Eliminate Vim/Neovim escape mode switching latency
set -g history-limit 50000    # Increase scrollback buffer size
set -g focus-events on        # Enable focus events for Neovim (autoread, FocusGained)

# Set prefix key to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start indexing windows and panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Automatically renumber windows when one is closed

# Reload tmux configuration
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config!"

# Splitting panes and windows in the current directory path
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Session switcher (since 's' was remapped to horizontal split)
bind S choose-tree -Zs

# Vim-like pane switching (also supported via vim-tmux-navigator with Ctrl+h/j/k/l)
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Vim-like pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enable vi mode to allow vim movements in copy mode
set-window-option -g mode-keys vi

# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi Escape send -X cancel

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Cross-platform clipboard pipe (macOS, WSL, Wayland, X11)
if-shell "uname | grep -q Darwin" {
  bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'
  bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'
} {
  if-shell "command -v clip.exe >/dev/null 2>&1" {
    bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'clip.exe'
    bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'clip.exe'
  } {
    if-shell "command -v wl-copy >/dev/null 2>&1" {
      bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'wl-copy'
      bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'wl-copy'
    } {
      bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
      bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
    }
  }
}

# --- TMUX PLUGINS ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Rosé Pine Moon Theme
set -g @plugin 'rose-pine/tmux'
set -g @rose_pine_variant 'moon'
set -g @rose_pine_host 'on'
set -g @rose_pine_user 'on'
set -g @rose_pine_directory 'on'

# Resurrect & Continuum (Persist and restore tmux sessions)
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Display cheatsheet in a floating popup with enriched Markdown formatting (bat)
bind-key / display-popup -w 80% -h 80% -E "if command -v bat >/dev/null 2>&1; then bat --style=plain --color=always ~/dotfiles/cheatsheet.md | less -r; elif command -v batcat >/dev/null 2>&1; then batcat --style=plain --color=always ~/dotfiles/cheatsheet.md | less -r; else cat ~/dotfiles/cheatsheet.md | less -r; fi"

# Automatic TPM installation if not already installed
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (must be at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'

# Enable 256-color, true-color and undercurl support for modern terminals and Neovim
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colors

# General
set -g mouse on               # Enable mouse support
set -g set-clipboard on       # Enable system clipboard (OSC 52)
set -g detach-on-destroy off  # Don't exit from tmux when closing a session
set -sg escape-time 0         # Eliminate Vim/Neovim escape mode switching latency
set -g history-limit 50000    # Increase scrollback buffer size
set -g focus-events on        # Enable focus events for Neovim (autoread, FocusGained)

# Set prefix key to Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start indexing windows and panes at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Automatically renumber windows when one is closed

# Reload tmux configuration
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux config!"

# Splitting panes and windows in the current directory path
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Session switcher (since 's' was remapped to horizontal split)
bind S choose-tree -Zs

# Vim-like pane switching (also supported via vim-tmux-navigator with Ctrl+h/j/k/l)
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

# Vim-like pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enable vi mode to allow vim movements in copy mode
set-window-option -g mode-keys vi

# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'V' send -X select-line
bind-key -T copy-mode-vi Escape send -X cancel

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Cross-platform clipboard pipe (macOS, WSL, Wayland, X11)
if-shell "uname | grep -q Darwin" {
  bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'pbcopy'
  bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'
} {
  if-shell "command -v clip.exe >/dev/null 2>&1" {
    bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'clip.exe'
    bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'clip.exe'
  } {
    if-shell "command -v wl-copy >/dev/null 2>&1" {
      bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'wl-copy'
      bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'wl-copy'
    } {
      bind-key -T copy-mode-vi 'y' send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
      bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
    }
  }
}

# --- TMUX PLUGINS ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'


# Resurrect & Continuum (Persist and restore tmux sessions)
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# tmux bar style
set -g status-position top
set -g status-style bg=default,fg=white # background color 
set -g window-status-current-style fg=white,bold,bg=default # active window
set -g window-status-style fg=colour8,bg=default # inactive windows
set -g status-right "#[fg=colour8]%d %b %H:%M" #right side only with hour
set -g status-left "#[fg=cyan,bold]#S #[fg=brightblack]| " # left side format
set -g status-left-length 30
setw -g window-status-current-format "#[fg=cyan,bold]#I:#[fg=white,bold]#W*"
setw -g window-status-format "#[fg=brightblack]#I:#W"
setw -g window-status-separator "  "


# Display the cheatsheet in a large, navigable popup (glow when available)
bind-key / display-popup -w 92% -h 92% -E "bash ~/.config/tmux/cheatsheet.sh"

# Install TPM itself and any missing plugin BEFORE initializing TPM, so that
# plugins cloned on the first start are sourced in the same session.
run-shell 'bash ~/.config/tmux/check_plugins.sh'

# Initialize TMUX plugin manager (must be at the very bottom of tmux.conf)
run-shell '~/.local/share/tmux/plugins/tpm/tpm'

# tmux-resurrect itself resets this option while loading, so override it after
# TPM has sourced the plugins. Continuum reads it 1s later, in its background
# auto-restore, which gives us enough time to replace it with our wrapper.
set -g @resurrect-restore-script-path "$HOME/.config/tmux/resurrect_restore.sh"
